services:
  # --- Infrastructure ---
  postgres:
    image: pgvector/pgvector:pg17
    container_name: assistai-postgres
    networks:
      - assistai-internal
    environment:
      POSTGRES_USER: assistai
      POSTGRES_PASSWORD: assistai_dev
      POSTGRES_DB: assistai
    # Only expose to host for local development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assistai-redis
    networks:
      - assistai-internal
    # Only expose to host for local development
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Applications ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    container_name: assistai-web
    networks:
      - assistai-internal
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: assistai-api
    networks:
      - assistai-internal
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://assistai:assistai_dev@postgres:5432/assistai
      - REDIS_URL=redis://redis:6379
      - PORT_API=3000
      - WEB_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: production
    container_name: assistai-worker
    networks:
      - assistai-internal
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://assistai:assistai_dev@postgres:5432/assistai
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Optional Services ---
  ipfs:
    image: ipfs/kubo:latest
    container_name: assistai-ipfs
    # IPFS ports only exposed in development, not in production
    ports:
      - "5001:5001"  # API
      - "8080:8080"  # Gateway
    volumes:
      - ipfsdata:/data/ipfs
    profiles:
      - ipfs

networks:
  assistai-internal:
    driver: bridge
    internal: false  # Allow external for development; set true for production

volumes:
  pgdata:
  redisdata:
  ipfsdata:
